<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <!-- Basics -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- page-head: each page's title, description, canonical, hreflang and
         social tags go here (src/lib/seo/pageHead.ts, written by
         scripts/prerender.mjs; kept in step in the browser). -->

    <!-- Brand: favicon.svg and the PNG icons are kept as designed; `npm run brand` draws only the .ico from favicon.svg -->
    <meta name="theme-color" content="#182F59" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts: Cairo is self-hosted (src/styles/index.css). The Arabic subset is
         preloaded: the default language, needed for the first paint. -->
    <link rel="preload" href="/fonts/cairo/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
